[package]
name        = "cwico-app"
description = "Tsu Cwico desktop application."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true

[lib]
name       = "cwico_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cwico"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cwico-core = { workspace = true }
tauri      = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde      = { workspace = true }
serde_json = { workspace = true }
time       = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
# Optional TsuDEV sign-in (ADR-0002 P2): same reqwest/rustls(ring) stack the
# updater already ships, so no second TLS library lands in the binary.
reqwest    = { version = "0.13", default-features = false, features = ["json", "form", "rustls-no-provider", "system-proxy"] }
base64     = { workspace = true }
rustls     = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
cwico-win = { workspace = true }
# There is nothing to update on a fixture build, and the plugin pulls in a
# download and process-spawning stack a Linux dev build has no use for.
tauri-plugin-updater = "2"
# Refresh token in Windows Credential Manager (DPAPI), never a plain file.
keyring = { version = "3", features = ["windows-native"] }

# See cwico-cli: a non-Windows build always uses the fixture backend.
[target.'cfg(not(windows))'.dependencies]
cwico-core = { workspace = true, features = ["mock"] }

[features]
default = []
# Force the fixture backend on Windows too, for developing the UI without
# touching the machine.
mock = ["cwico-core/mock"]
