name: Release

on:
  push:
    # Release tags carry the product's machine name: tsucwico-v26.11.16.
    # Up to 26.11.1002 they were tsudev-cwico-v* (docs/adr/0001).
    tags: ["tsucwico-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Draft a GitHub release (tag pushes always do)"
        type: boolean
        default: false

# Least privilege at workflow level; the single job asks for what it needs (Scorecard Token-Permissions).
permissions:
  contents: read

jobs:
  build:
    name: Build installers
    permissions:
      contents: write
      # actions/attest-build-provenance: signs a SLSA provenance statement for
      # every file a user downloads, verifiable with `gh attestation verify`.
      id-token: write
      attestations: write
    runs-on: windows-latest
    env:
      # Windows runners default Python's file and console encoding to cp1252;
      # CHANGELOG.md and the release notes carry Vietnamese. Without this the
      # notes step dies on the first "ị" (tsudev-cwico-v26.11.10, 10/11/2026).
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (toolchain theo rust-toolchain.toml)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Tagging without bumping the manifests would ship a build that reports
      # the previous version - and the updater compares exactly that number,
      # so every user would be told they are already current.
      - name: Check the tag matches the version in the manifests
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected=$(python3 tools/version.py to-semver "${{ github.ref_name }}")
          actual=$(python3 tools/version.py current | grep -oE '\(semver [^)]+\)' | sed 's/(semver //;s/)//')
          echo "tag      ${{ github.ref_name }} -> $expected"
          echo "manifests                       -> $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::the tag and the manifests disagree." \
                 "Run 'tools/version.py set ${{ github.ref_name }}' and commit before tagging."
            exit 1
          fi

      - name: Check the version encoding
        shell: bash
        run: python3 tools/test_version.py

      # The release body becomes `latest.json`'s `notes`, which the application
      # shows inside the mandatory update dialog. A blocking screen with no
      # explanation is worse than no blocking screen, so a missing CHANGELOG
      # section fails the build rather than shipping an empty one.
      - name: Extract the release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<CWICO_NOTES_EOF'
            # On a manual run `ref_name` is the branch; fall back to whatever
            # version the manifests currently carry.
            if python3 tools/version.py to-semver "${{ github.ref_name }}" >/dev/null 2>&1; then
              python3 tools/changelog_section.py "${{ github.ref_name }}"
            else
              python3 tools/changelog_section.py
            fi
            echo 'CWICO_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - run: npm --prefix ui ci

      # A tag push drafts a release; a manual run only produces artefacts, so
      # the packaging pipeline can be exercised without leaving a half-finished
      # release behind.
      #
      # The release is drafted rather than published on purpose: the updater
      # endpoint resolves `releases/latest`, which ignores drafts, so nothing
      # is delivered to users until the release is published by hand. That is
      # the last human checkpoint before a mandatory update reaches every
      # installation.
      - name: Build installers and draft the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update payload so installed copies will accept it.
          # Not the same as Authenticode - see docs/SIGNING.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          # `latest.json` is what installed copies poll. Without it the
          # updater has nothing to read and no update is ever delivered.
          uploadUpdaterJson: true
          # The bundler names files after productName ("Tsu Cwico_..."); the
          # release carries the machine name instead, which packaging/package.json,
          # tools/winget-manifest.ps1 and the website all expect.
          releaseAssetNamePattern: "tsucwico_[version]_[arch][setup][ext]"
          args: --verbose

      - name: Build installers only
        if: "!(startsWith(github.ref, 'refs/tags/') || inputs.publish)"
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app/src-tauri
          args: --verbose

      - name: Build the CLI
        run: cargo build -p cwico-cli --release

      # The CLI and the desktop app are both called cwico.exe inside
      # target/release, so the CLI is copied out under a release-style name
      # before anything else can overwrite it. Users get it from the release
      # page (and cwico.tsudev.com/dong-lenh/) instead of building from source.
      - name: Name the CLI for release
        id: cli
        shell: bash
        run: |
          semver=$(python3 tools/version.py current | grep -oE '\(semver [^)]+\)' | sed 's/(semver //;s/)//')
          name="tsucwico_${semver}_x64-cli.exe"
          mkdir -p dist-cli
          cp target/release/cwico.exe "dist-cli/$name"
          (cd dist-cli && sha256sum "$name")
          echo "path=dist-cli/$name" >> "$GITHUB_OUTPUT"

      - name: Attach the CLI to the draft release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ steps.cli.outputs.path }}" --clobber

      # SHA256SUMS.txt lists every file a user can download from the release,
      # under the names it was uploaded with. Scoop and winget take their hashes
      # from it rather than from a copy. SHA256SUMS.txt.sig is signed with the
      # updater key (`tauri signer sign`: a base64-wrapped minisign signature;
      # base64-decode it, then `minisign -Vm SHA256SUMS.txt -x <decoded> -P
      # <pubkey>` with the pubkey from tauri.conf.json, also base64-decoded).
      - name: Publish SHA256SUMS.txt and build provenance
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          rm -rf dist-release && mkdir dist-release
          gh release download "$tag" -D dist-release -p '*.exe' -p '*.msi' -p '*.sig' -p 'latest.json'
          cd dist-release
          ls -1 | grep -v '^SHA256SUMS' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          npx --yes @tauri-apps/cli@2 signer sign SHA256SUMS.txt
          gh release upload "$tag" SHA256SUMS.txt SHA256SUMS.txt.sig --clobber

      - name: Attest the release files
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist-release/SHA256SUMS.txt

      - name: Record installer hashes
        shell: pwsh
        run: |
          $bundle = "app/src-tauri/target/release/bundle"
          if (-not (Test-Path $bundle)) { $bundle = "target/release/bundle" }
          Get-ChildItem -Recurse -Include *.msi,*.exe,*.sig $bundle |
            ForEach-Object {
              "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash, $_.Name
            } | Tee-Object -FilePath sha256sums.txt

      - name: Generate the winget installer manifest
        shell: pwsh
        # The SHA256 and ProductCode change with every build, so the manifest
        # is generated rather than hand-edited at release time.
        run: >
          ./tools/winget-manifest.ps1
          -Repository "${{ github.repository }}"
          -Tag "${{ github.ref_name }}"

      # A release whose payload is unsigned is a release installed copies will
      # refuse, and the failure would only show up on a user's machine.
      - name: Confirm the update payload was signed
        shell: pwsh
        run: |
          $bundle = "app/src-tauri/target/release/bundle"
          if (-not (Test-Path $bundle)) { $bundle = "target/release/bundle" }
          $sigs = Get-ChildItem -Recurse -Filter *.sig $bundle
          if (-not $sigs) {
            Write-Error ("no .sig files were produced - TAURI_SIGNING_PRIVATE_KEY " +
                         "is probably missing, and installed copies would reject " +
                         "this update")
            exit 1
          }
          $sigs | ForEach-Object { Write-Host "  signed: $($_.Name)" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.sig
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.sig
            dist-cli/*.exe
            sha256sums.txt
            winget-installer-manifest.yaml
